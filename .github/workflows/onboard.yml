name: Onboard apps from swagger

# Runs the onboarding script whenever a swagger file changes on the branch.
on:
  push:
    branches: [feature/swagger-pipeline]
    paths:
      - "swagger/**"
  workflow_dispatch: {}

jobs:
  onboard:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
      # Set these as repo Variables (Settings > Secrets and variables > Actions > Variables)
      # using the values from `terraform output`.
      ROUTES_TABLE: ${{ vars.ROUTES_TABLE }}
      USAGE_PLAN_ID: ${{ vars.USAGE_PLAN_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Onboard every swagger
        run: |
          for f in swagger/*.yaml; do
            echo "=== $f ==="
            python scripts/onboard.py "$f"
          done
